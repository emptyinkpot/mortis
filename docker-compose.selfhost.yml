# Self-hosting Docker Compose — starts PostgreSQL, backend, and frontend.
#
# Usage:
#   cp .env.example .env
#   # Edit .env — change JWT_SECRET at minimum
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8080 (also used by CLI/daemon)

name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
      - ${MORTIS_AGENT_WORK_ROOT:-/srv/multica/agent-workspaces}:${MORTIS_AGENT_WORK_ROOT:-/srv/multica/agent-workspaces}
      - ${MORTIS_CODEX_HOME:-/srv/multica/codex-home}:/root/.codex
      - ${MORTIS_ROLE_LOCAL_REPO_PATH:-/srv/multica}:/source:ro
      - ${MORTIS_ROLE_GIT_SSH_KEY_PATH:-/home/ubuntu/.ssh/mortis_multica_source_ed25519}:/root/.ssh/mortis_role_key:ro
      - ${MORTIS_ROLE_GIT_KNOWN_HOSTS_PATH:-/home/ubuntu/.ssh/known_hosts}:/root/.ssh/known_hosts:ro
      - ${MORTIS_OPENLIST_EXPORT_HOST_DIR:-/srv/multica/openlist-export}:${MORTIS_OPENLIST_EXPORT_DIR:-/app/openlist-export}
      - ${MORTIS_RUNTIME_HOST_DIR:-/srv/multica/.runtime}:${MORTIS_RUNTIME_ROOT:-/app/.runtime}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
      MULTICA_AUTO_LOGIN_EMAIL: ${MULTICA_AUTO_LOGIN_EMAIL:-}
      MULTICA_AUTO_LOGIN_NAME: ${MULTICA_AUTO_LOGIN_NAME:-}
      MULTICA_AUTO_LOGIN_WORKSPACE_NAME: ${MULTICA_AUTO_LOGIN_WORKSPACE_NAME:-}
      MULTICA_AUTO_LOGIN_WORKSPACE_SLUG: ${MULTICA_AUTO_LOGIN_WORKSPACE_SLUG:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_DSN: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_DSN:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_HOST: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_HOST:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_PORT: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_PORT:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_USER: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_USER:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_PASSWORD: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_PASSWORD:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_DATABASE: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_DATABASE:-}
      MORTIS_NAPCAT_ACCOUNTS_MYSQL_TABLE: ${MORTIS_NAPCAT_ACCOUNTS_MYSQL_TABLE:-}
      MORTIS_NAPCAT_ACCOUNTS_JSON: ${MORTIS_NAPCAT_ACCOUNTS_JSON:-}
      MORTIS_NAPCAT_ACCOUNTS_FILE: ${MORTIS_NAPCAT_ACCOUNTS_FILE:-}
      MORTIS_QQ_DEFAULT_LABEL: ${MORTIS_QQ_DEFAULT_LABEL:-}
      MORTIS_QQ_UIN: ${MORTIS_QQ_UIN:-}
      MORTIS_QQ_ONEBOT_HTTP_URL: ${MORTIS_QQ_ONEBOT_HTTP_URL:-}
      MORTIS_QQ_ONEBOT_HTTP_URLS: ${MORTIS_QQ_ONEBOT_HTTP_URLS:-}
      MORTIS_QQ_TRANSPORT: ${MORTIS_QQ_TRANSPORT:-}
      MORTIS_QQ_WEBUI_URL: ${MORTIS_QQ_WEBUI_URL:-}
      MORTIS_QQ_WEBUI_TOKEN: ${MORTIS_QQ_WEBUI_TOKEN:-}
      MORTIS_QQ_WEBUI_CONFIG_PATH: ${MORTIS_QQ_WEBUI_CONFIG_PATH:-}
      MORTIS_QQ_NOTIFY_ENABLED: ${MORTIS_QQ_NOTIFY_ENABLED:-false}
      MORTIS_QQ_NOTIFY_INTERVAL_SECONDS: ${MORTIS_QQ_NOTIFY_INTERVAL_SECONDS:-5}
      MORTIS_QQ_NOTIFY_TARGET_TYPE: ${MORTIS_QQ_NOTIFY_TARGET_TYPE:-}
      MORTIS_QQ_NOTIFY_TARGET_ID: ${MORTIS_QQ_NOTIFY_TARGET_ID:-}
      MORTIS_TELEGRAM_NOTIFY_ENABLED: ${MORTIS_TELEGRAM_NOTIFY_ENABLED:-false}
      MORTIS_TELEGRAM_NOTIFY_INTERVAL_SECONDS: ${MORTIS_TELEGRAM_NOTIFY_INTERVAL_SECONDS:-5}
      MORTIS_TELEGRAM_NOTIFY_CHAT_ID: ${MORTIS_TELEGRAM_NOTIFY_CHAT_ID:-}
      MORTIS_TELEGRAM_API_BASE_URL: ${MORTIS_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      MORTIS_TELEGRAM_AUTO_APPROVE_LOW_RISK: ${MORTIS_TELEGRAM_AUTO_APPROVE_LOW_RISK:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MORTIS_LETTA_ENABLED: ${MORTIS_LETTA_ENABLED:-false}
      MORTIS_LETTA_BASE_URL: ${MORTIS_LETTA_BASE_URL:-http://127.0.0.1:8283}
      MORTIS_LETTA_SERVER_PASSWORD: ${MORTIS_LETTA_SERVER_PASSWORD:-}
      MORTIS_QQ_INBOUND_ENABLED: ${MORTIS_QQ_INBOUND_ENABLED:-false}
      MORTIS_QQ_INBOUND_SECRET: ${MORTIS_QQ_INBOUND_SECRET:-}
      MORTIS_OPERATOR_EVENT_SECRET: ${MORTIS_OPERATOR_EVENT_SECRET:-}
      MORTIS_QQ_INBOUND_WORKSPACE_SLUG: ${MORTIS_QQ_INBOUND_WORKSPACE_SLUG:-mortis}
      MORTIS_QQ_INBOUND_OPERATOR_EMAIL: ${MORTIS_QQ_INBOUND_OPERATOR_EMAIL:-}
      MORTIS_QQ_INBOUND_OPERATOR_NAME: ${MORTIS_QQ_INBOUND_OPERATOR_NAME:-QQ Operator}
      MORTIS_QQ_INBOUND_ALLOWED_GROUP_IDS: ${MORTIS_QQ_INBOUND_ALLOWED_GROUP_IDS:-}
      MORTIS_QQ_INBOUND_ALLOWED_USER_IDS: ${MORTIS_QQ_INBOUND_ALLOWED_USER_IDS:-}
      MORTIS_QQ_BOT_USER_IDS: ${MORTIS_QQ_BOT_USER_IDS:-}
      MORTIS_QQ_INBOUND_REQUIRE_MENTION: ${MORTIS_QQ_INBOUND_REQUIRE_MENTION:-true}
      MORTIS_QQ_INBOUND_AUTO_APPROVE_LOW_RISK: ${MORTIS_QQ_INBOUND_AUTO_APPROVE_LOW_RISK:-false}
      MORTIS_QQ_INBOUND_ACK_ENABLED: ${MORTIS_QQ_INBOUND_ACK_ENABLED:-false}
      MORTIS_QQ_INBOUND_CONVERSATION_KEY: ${MORTIS_QQ_INBOUND_CONVERSATION_KEY:-company-room}
      MORTIS_QQ_LIVING_AGENTS_ENABLED: ${MORTIS_QQ_LIVING_AGENTS_ENABLED:-false}
      MORTIS_QQ_LIVING_GROUP_ID: ${MORTIS_QQ_LIVING_GROUP_ID:-}
      MORTIS_QQ_LLM_ENABLED: ${MORTIS_QQ_LLM_ENABLED:-false}
      MORTIS_QQ_LLM_BASE_URL: ${MORTIS_QQ_LLM_BASE_URL:-https://sub2api.tengokukk.com/v1}
      MORTIS_QQ_LLM_MODEL: ${MORTIS_QQ_LLM_MODEL:-coze-shell}
      MORTIS_QQ_LLM_WIRE_API: ${MORTIS_QQ_LLM_WIRE_API:-chat_completions}
      MORTIS_QQ_LLM_TIMEOUT_SECONDS: ${MORTIS_QQ_LLM_TIMEOUT_SECONDS:-75}
      MORTIS_QQ_LLM_API_KEY: ${MORTIS_QQ_LLM_API_KEY:-}
      MORTIS_GLM_API_KEY: ${MORTIS_GLM_API_KEY:-}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      MORTIS_QQ_CHAT_RUNTIME: ${MORTIS_QQ_CHAT_RUNTIME:-glm}
      MORTIS_QQ_RESEARCH_RUNTIME: ${MORTIS_QQ_RESEARCH_RUNTIME:-glm}
      MORTIS_QQ_PLANNING_RUNTIME: ${MORTIS_QQ_PLANNING_RUNTIME:-glm}
      MORTIS_QQ_CODE_RUNTIME: ${MORTIS_QQ_CODE_RUNTIME:-codex}
      MORTIS_QQ_TEST_RUNTIME: ${MORTIS_QQ_TEST_RUNTIME:-codex}
      MORTIS_OPENLIST_EXPORT_DIR: ${MORTIS_OPENLIST_EXPORT_DIR:-}
      MORTIS_OPENLIST_API_URL: ${MORTIS_OPENLIST_API_URL:-}
      MORTIS_OPENLIST_TOKEN: ${MORTIS_OPENLIST_TOKEN:-}
      MORTIS_OPENLIST_REMOTE_DIR: ${MORTIS_OPENLIST_REMOTE_DIR:-}
      MORTIS_AI_CEO_QQ: ${MORTIS_AI_CEO_QQ:-3974470627}
      MORTIS_AI_BUILDER_QQ: ${MORTIS_AI_BUILDER_QQ:-3316734532}
      MORTIS_AI_TESTER_QQ: ${MORTIS_AI_TESTER_QQ:-3615811141}
      MORTIS_AI_WATCHER_QQ: ${MORTIS_AI_WATCHER_QQ:-2264869713}
      MORTIS_AI_CEO_ONEBOT_URL: ${MORTIS_AI_CEO_ONEBOT_URL:-http://napcat-qq1:3000}
      MORTIS_AI_BUILDER_ONEBOT_URL: ${MORTIS_AI_BUILDER_ONEBOT_URL:-http://napcat-qq3:3000}
      MORTIS_AI_TESTER_ONEBOT_URL: ${MORTIS_AI_TESTER_ONEBOT_URL:-http://napcat-qq2:3000}
      MORTIS_AI_WATCHER_ONEBOT_URL: ${MORTIS_AI_WATCHER_ONEBOT_URL:-http://napcat-qq4:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MORTIS_ROLE_DISPATCHER_ENABLED: ${MORTIS_ROLE_DISPATCHER_ENABLED:-false}
      MORTIS_MAILBOX_CONSUMER_ENABLED: ${MORTIS_MAILBOX_CONSUMER_ENABLED:-false}
      MORTIS_ROLE_REPO_URL: ${MORTIS_ROLE_REPO_URL:-git@github.com:emptyinkpot/mortis-multica-source.git}
      MORTIS_ROLE_BASE_BRANCH: ${MORTIS_ROLE_BASE_BRANCH:-main}
      MORTIS_AGENT_WORK_ROOT: ${MORTIS_AGENT_WORK_ROOT:-/srv/multica/agent-workspaces}
      MORTIS_CODEX_HOME: ${MORTIS_CODEX_HOME:-/root/.codex}
      MORTIS_CODEX_BIN: ${MORTIS_CODEX_BIN:-codex}
      MORTIS_CODEX_MODEL: ${MORTIS_CODEX_MODEL:-}
      MORTIS_CODEX_TIMEOUT_SECONDS: ${MORTIS_CODEX_TIMEOUT_SECONDS:-900}
      MORTIS_CODEX_MAX_ATTEMPTS: ${MORTIS_CODEX_MAX_ATTEMPTS:-2}
      MORTIS_BUILDER_CONTAINER_IMAGE: ${MORTIS_BUILDER_CONTAINER_IMAGE:-}
      MORTIS_CODEX_DANGEROUSLY_BYPASS_SANDBOX: ${MORTIS_CODEX_DANGEROUSLY_BYPASS_SANDBOX:-false}
      MORTIS_ROLE_DISPATCH_INTERVAL_SECONDS: ${MORTIS_ROLE_DISPATCH_INTERVAL_SECONDS:-2}
      MORTIS_ROLE_GIT_USER: ${MORTIS_ROLE_GIT_USER:-Mortis Builder AI}
      MORTIS_ROLE_GIT_EMAIL: ${MORTIS_ROLE_GIT_EMAIL:-builder@mortis.local}
      GIT_SSH_COMMAND: ${GIT_SSH_COMMAND:-ssh -i /root/.ssh/mortis_role_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: http://backend:8080
        MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        MULTICA_AUTO_LOGIN_WORKSPACE_SLUG: ${MULTICA_AUTO_LOGIN_WORKSPACE_SLUG:-}
        NEXT_PUBLIC_AUTO_LOGIN_WORKSPACE_SLUG: ${NEXT_PUBLIC_AUTO_LOGIN_WORKSPACE_SLUG:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ${ATRAMENTI_CONTROL_PLANE_HOST_PATH:-/home/ubuntu/atramenti-console-src}:${ATRAMENTI_CONTROL_PLANE_REPO_ROOT:-/control-plane-source}:ro
    environment:
      HOSTNAME: "0.0.0.0"
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
      MULTICA_AUTO_LOGIN_WORKSPACE_SLUG: ${MULTICA_AUTO_LOGIN_WORKSPACE_SLUG:-}
      NEXT_PUBLIC_AUTO_LOGIN_WORKSPACE_SLUG: ${NEXT_PUBLIC_AUTO_LOGIN_WORKSPACE_SLUG:-}
      ATRAMENTI_CONTROL_PLANE_REPO_ROOT: ${ATRAMENTI_CONTROL_PLANE_REPO_ROOT:-/control-plane-source}
      ATRAMENTI_CONTROL_PLANE_CANONICAL_REPO_URL: ${ATRAMENTI_CONTROL_PLANE_CANONICAL_REPO_URL:-}
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
